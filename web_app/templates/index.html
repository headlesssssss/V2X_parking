<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking 3D - Jumeau Numérique</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #444; min-width: 200px; }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; letter-spacing: 1px; color: #eee; }
        .label { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .highlight { color: #4CAF50; font-weight: bold; font-size: 1.4em; display: block; }
        .error { color: #f44336; font-weight: bold; font-size: 1.4em; display: block; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>🚗 SMART PARKING 3D</h1>
        <div class="label">Meilleure place disponible :</div>
        <span id="best-spot">Démarrage...</span>
    </div>

    <div id="canvas-container"></div>

    <script>
        console.log("🚀 ÉTAPE 1 : Le code JavaScript vient de démarrer !");

        // --- 1. CONFIGURATION ---
        const cellWidth = 6.5;    
        const cellDepth = 8.0;    
        const wallThickness = 0.6; 
        const wallHeight = 1.5;

        // --- 2. INITIALISATION DE LA SCÈNE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 40, 50); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 50, 10);
        scene.add(sunLight);

        let isSceneBuilt = false;
        const spotsMeshes = {}; 
        let pathLine = null;    
        const activeCars = {}; 
        let carModelTemplate = null;

        console.log("✅ ÉTAPE 2 : Scène 3D initialisée. Lancement du chargement de la voiture...");

        // --- 3. CHARGEMENT DU MODÈLE ---
        try {
            const loader = new THREE.GLTFLoader();
            loader.load('/static/car.glb', function(gltf) {
                carModelTemplate = gltf.scene;
                
                // On augmente fortement la taille
                carModelTemplate.scale.set(3.5, 3.5, 3.5); 
                
                // On tourne la voiture de 90 degrés pour qu'elle rentre dans la place
                carModelTemplate.rotation.y = Math.PI / 2; 
                
                console.log("🚗 SUCCÈS : Modèle de voiture chargé !");
            }, undefined, function(error) {
                console.error("❌ ERREUR : Impossible de trouver /static/car.glb", error);
            });
        } catch(e) {
            console.error("Erreur critique sur Three.js :", e);
        }

        // --- 4. CONSTRUCTION DU PARKING ---
        function buildParking(grid) {
            console.log("🏗️ ÉTAPE 4 : Construction du parking en 3D...");
            const rows = grid.length;
            const cols = grid[0].length;
            const offsetX = (cols * cellWidth) / 2 - (cellWidth / 2);
            const offsetZ = (rows * cellDepth) / 2 - (cellDepth / 2);

            const groundGeo = new THREE.PlaneGeometry(cols * cellWidth + 10, rows * cellDepth + 10);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, -0.05, 0);
            scene.add(ground);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const val = grid[r][c];
                    const posX = c * cellWidth - offsetX;
                    const posZ = r * cellDepth - offsetZ;
                    
                    if (val === 1) {
                        const wall = new THREE.Mesh(new THREE.BoxGeometry(cellWidth, wallHeight, wallThickness), new THREE.MeshStandardMaterial({ color: 0x444444 }));
                        wall.position.set(posX, wallHeight / 2, posZ);
                        scene.add(wall);
                    } else if (val >= 10 && val <= 90) {
                        const spot = new THREE.Mesh(new THREE.BoxGeometry(cellWidth * 0.9, 0.05, cellDepth * 0.9), new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0.6 }));
                        spot.position.set(posX, 0.02, posZ);
                        scene.add(spot);
                        spotsMeshes[val] = spot;
                    } else if (val === 98) {
                        const entrance = new THREE.Mesh(new THREE.PlaneGeometry(cellWidth, cellDepth), new THREE.MeshStandardMaterial({ color: 0x2c3e50 }));
                        entrance.rotation.x = -Math.PI / 2;
                        entrance.position.set(posX, 0.01, posZ);
                        scene.add(entrance);
                    }
                }
            }
            isSceneBuilt = true;
            console.log("✅ FINI : Parking construit !");
        }

        // --- 5. VOITURES & CHEMIN ---
        function addCar(spotId, position) {
            if (!activeCars[spotId] && carModelTemplate) {
                const car = carModelTemplate.clone();
                
                // On soulève la voiture sur l'axe Y (0.8) pour sortir les roues du sol
                car.position.set(position.x, 0.8, position.z); 
                
                scene.add(car);
                activeCars[spotId] = car;
            }
        }

        function removeCar(spotId) {
            if (activeCars[spotId]) {
                scene.remove(activeCars[spotId]);
                delete activeCars[spotId];
            }
        }

        function drawPath(pathArray, grid) {
            if (pathLine) { scene.remove(pathLine); pathLine = null; }
            if (!pathArray || pathArray.length === 0) return;
            const offsetX = (grid[0].length * cellWidth) / 2 - (cellWidth / 2);
            const offsetZ = (grid.length * cellDepth) / 2 - (cellDepth / 2);
            const points = [];
            pathArray.forEach(coord => {
                points.push(new THREE.Vector3(coord.col * cellWidth - offsetX, 0.6, coord.row * cellDepth - offsetZ));
            });
            pathLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0x00d2ff, linewidth: 5 }));
            scene.add(pathLine);
        }

        // --- 6. APPEL DE L'API ---
        async function fetchParkingData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                if (!isSceneBuilt && data.grid) buildParking(data.grid);

                // Mise à jour de l'interface corrigée
                const spotElement = document.getElementById('best-spot');
                if (data.best_spot !== undefined && data.best_spot !== null) {
                    spotElement.className = "highlight";
                    spotElement.innerText = "Place N° " + data.best_spot;
                } else {
                    spotElement.className = "error";
                    spotElement.innerText = "PARKING COMPLET";
                }

                if (data.status) {
                    for (const [spotId, status] of Object.entries(data.status)) {
                        const mesh = spotsMeshes[spotId];
                        if (mesh) {
                            if (status === "FREE") {
                                mesh.material.color.setHex(0x4CAF50); removeCar(spotId);
                            } else if (status === "OCCUPIED") {
                                mesh.material.color.setHex(0xf44336); addCar(spotId, mesh.position);
                            } else {
                                mesh.material.color.setHex(0x333333); removeCar(spotId);
                            }
                        }
                    }
                }
                if (data.path && data.grid) drawPath(data.path, data.grid);
            } catch (error) { 
                console.error("🚨 ERREUR API :", error); 
            }
        }

        // --- 7. LANCEMENT ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log("🏁 ÉTAPE 3 : Démarrage du moteur 3D et de l'horloge API !");
        animate();
        fetchParkingData();
        setInterval(fetchParkingData, 2000);

    </script>
</body>
</html>

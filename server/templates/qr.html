<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code — Parking V2X</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --text2: #6e6e73;
      --accent: #0a84ff; --border: #e5e5ea; --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b; --surface: #18181b; --text: #fafafa; --text2: #a1a1aa;
        --border: #3f3f46;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px; text-align: center;
      max-width: 400px; width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -.02em; }
    .sub { color: var(--text2); font-size: .85rem; margin-bottom: 24px; }
    #qr-canvas { margin: 0 auto 20px; }
    .url {
      display: inline-block; padding: 8px 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'SF Mono', monospace; font-size: .85rem;
      color: var(--accent); font-weight: 600; letter-spacing: -.01em;
      word-break: break-all;
    }
    .hint { margin-top: 16px; font-size: .75rem; color: var(--text2); }
    .back { margin-top: 20px; }
    .back a {
      color: var(--accent); text-decoration: none; font-size: .85rem; font-weight: 500;
    }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Parking V2X</h1>
    <p class="sub">Scannez ce QR code pour accéder au parking intelligent</p>
    <div id="qr-canvas"></div>
    <div class="url">{{ url }}</div>
    <p class="hint">Connectez votre téléphone au même réseau WiFi que le serveur<br>(IP : {{ ip }})</p>
    <div class="back"><a href="/">← Retour au parking</a></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById('qr-canvas'), {
      text: '{{ url }}',
      width: 200,
      height: 200,
      colorDark: getComputedStyle(document.documentElement).getPropertyValue('--text').trim(),
      colorLight: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim(),
      correctLevel: QRCode.CorrectLevel.M,
    });
  </script>
</body>
</html>
